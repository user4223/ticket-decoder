[project]
name = "ticket-decoder"
version = "v0.20.4"
description = "Train ticket barcode to json decoding library, using zxing-cpp decoding in combination with record interpreter, to transform content into json structure"
license = "GPL-3.0-or-later"
authors = [ { name = "user4223" } ]
readme = "source/python/README.md"
keywords = ["train-ticket", "barcode", "aztec-code", "uic918", "vdv", "sbb", "oebb"]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/user4223/ticket-decoder"
Issues = "https://github.com/user4223/ticket-decoder/issues"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "**/conanfile.py" },
    { file = "**/CMakeLists.txt" },
    { file = "source/**/*.{h,c,cpp}" }
    ]

[build-system]
requires = ["scikit-build-core-conan"]
build-backend = "scikit_build_core_conan.build"

[tool.cibuildwheel.environment]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"             # easylogging has a quite old cmake requirement, that fails with cmake >= 4 due to deprecation

[tool.cibuildwheel.macos.environment]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
MACOSX_DEPLOYMENT_TARGET = "10.15"               # stdlib c++17 features required: https://cibuildwheel.pypa.io/en/stable/cpp_standards/#macos-and-deployment-target-versions

[tool.cibuildwheel]
build-verbosity = 2                              # https://cibuildwheel.pypa.io/en/stable/options/#build-verbosity
build = [                                        # https://cibuildwheel.pypa.io/en/stable/options/#build-skip
    "cp31?-macosx_arm64",
    "cp31?-macosx_x86_64",
    "cp31?-manylinux_aarch64",
    "cp31?-manylinux_x86_64",
    "cp31?-win_arm64",
    "cp31?-win_amd64",
    ]
manylinux-aarch64-image = "manylinux_2_34"       # https://cibuildwheel.pypa.io/en/stable/options/#linux-image
manylinux-x86_64-image = "manylinux_2_34"
before-test = "python {project}/cert/install-uic-keys.py"
test-command = "python {project}/source/test/python/wheel_smoke_test.py"

[tool.cibuildwheel.linux]
before-build = "rm -rf build/Release"
# auditwheel should be called in any case to unify wheels but it requires at least some .so files, but our dependencies are fully statically linked.
# we don't have the path to the build directory here, so we unzip the two ...u_flex.so files from the wheel to include them right afterwards again.
repair-wheel-command = "unzip -o -j -d .libs {wheel} \"*lib*.so\" && LD_LIBRARY_PATH=`pwd`/.libs auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel"
# delvewheel should be called in any case to unify wheels but it requires at least some .dll files, but our dependencies are fully statically linked.
# we don't have the path to the build directory here, so we unzip the two ...u_flex.dll files from the wheel to include them right afterwards again.
repair-wheel-command = "python -m zipfile -e \"{wheel}\" \".libs\" && delvewheel repair --add-path \".libs\\ticket_decoder\" -w \"{dest_dir}\" \"{wheel}\""

[tool.scikit-build-core-conan]
path = "."
build = "missing"
output-folder = "build/Release"
settings-all = [
    "build_type=Release", 
    "compiler.cppstd=20"
    ]
config-all = [
    # We have to define the build type here additionally, because some depenencies does not work with the default build type of conan.
    "tools.cmake:configure_args=[\"-DCMAKE_BUILD_TYPE=Release\"]"
    ]
options-all = [
    "&:with_system_boost=False",
    "&:with_ticket_analyzer=False",
    "&:with_ticket_decoder=False",
    "&:with_python_module=True",
    "&:with_square_detector=False",
    "&:with_classifier_detector=False",
    "&:with_barcode_decoder=True",
    "&:with_pdf_input=True",
    "&:with_signature_verifier=True",
    "&:with_uic_interpreter=True",
    "&:with_vdv_interpreter=True",
    "&:with_sbb_interpreter=True"
    ]

# [[tool.scikit-build-core-conan.local-recipes]]
# path = "etc/poppler/conanfile.py"

[tool.scikit-build]
strict-config = true
logging.level = "WARNING"

build-dir = "build/Release"
build.verbose = false
build.requires = ["conan>=2.28", "nanobind"]
build.targets = ["ticket_decoder"]

cmake.build-type = "Release"
cmake.args = [ "--toolchain build/Release/build/Release/generators/conan_toolchain.cmake" ]
cmake.define = { CMAKE_BUILD_TYPE = "Release", CMAKE_CONFIGURATION_TYPES = "Release", CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

sdist.exclude = ["build/", "conan2/", "uvc/", ".github/", ".vscode/", "dist/", "out/", "venv/", "*.log", "*.pnm", "setup.*.sh"]
sdist.include = ["doc/*", "cert/*", "images/*"]
sdist.inclusion-mode = "default"
sdist.reproducible = true

wheel.license-files = ["LICENSES/*"]
wheel.cmake = true
wheel.platlib = "platlib"                        # Target the platlib (platform specific) or the purelib (pure python and platform independent)
wheel.expand-macos-universal-tags = true         # Fill out extra tags that are not required

install.strip = false                            # Whether to strip the binaries
